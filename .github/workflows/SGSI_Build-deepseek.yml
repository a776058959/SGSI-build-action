name: SGSI_Build_deepseek

on:
  watch:
    types: [started]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}/SGSI-build-tool

    steps:
      - name: Checkout
        uses: actions/checkout@v4  # 升级到最新版本

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip python3-dev \
            liblzma-dev build-essential \
            git wget zip unzip curl axel

      - name: Install Python dependencies
        run: |
          python3 -m pip install --user "protobuf<=4.25.3" "pycryptodome==3.20.0"

      - name: Load Configuration
        uses: falti/dotenv-action@v1.1.0  # 升级到稳定版本
        id: config
        with:
          path: config.env

      - name: Check Configuration
        run: |
          function required () { 
            if [[ -z "$1" ]]; then 
              echo "::error::$2 variable can't be null."
              exit 1
            fi
          }
          required "${{ steps.config.outputs.rom_url }}" "ROM_URL"
          required "${{ steps.config.outputs.build_type }}" "BUILD_TYPE"
          required "${{ steps.config.outputs.os_type }}" "OS_TYPE"
          required "${{ steps.config.outputs.zip_name }}" "ZIP_NAME"
          required "${{ steps.config.outputs.version }}" "VERSION"
          required "${{ steps.config.outputs.repack_name }}" "REPACK_NAME"

      - name: Cleanup workspace
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Cloning SGSI source code
        run: |
          git clone --depth=1 --recurse-submodules \
            https://github.com/xiaoxindada/SGSI-build-tool.git -b 12 \
            $GITHUB_WORKSPACE/SGSI-build-tool

      - name: Setup sGSI tools requirements
        run: |
          sed -i 's/USE_MIRROR_FOR_PIP=true/USE_MIRROR_FOR_PIP=false/' setup.sh
          bash setup.sh

      - name: Build SGSI
        run: |
          bash ./url2SGSI.sh \
            "${{ steps.config.outputs.rom_url }}" \
            "${{ steps.config.outputs.os_type }}" \
            "${{ steps.config.outputs.build_type }}"

      - name: Repack Output File
        run: |
          mkdir -p upload
          output_file="upload/${{ steps.config.outputs.repack_name }}"
          
          if [[ $(du -sb SGSI/ | awk '{print $1}') -gt 2000000000 ]]; then
            7z a -v2000m "$output_file.7z" SGSI/*  # 使用更高效的7z分卷
          else
            7z a "$output_file.7z" SGSI/*
          fi
          ls -lh upload

      - name: Upload SGSI to GH-Release
        uses: softprops/action-gh-release@v1  # 更稳定的Release插件
        with:
          files: upload/*
          name: "${{ steps.config.outputs.os_type }}${{ steps.config.outputs.build_type }}-Android${{ steps.config.outputs.version }}-unpack"
          tag: "${{ steps.config.outputs.os_type }}-${{ steps.config.outputs.build_type }}-${{ github.run_id }}"  # 使用唯一ID
          body_path: SGSI/build_info.txt